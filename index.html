<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СОСТАВ.SCAN — проверка состава</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/zxing-library/0.20.0/index.min.js"></script>
<style>
  :root{
    --bg:#0A0D11;
    --panel:#11161C;
    --panel2:#161C24;
    --line:#232A34;
    --text:#E9EDF1;
    --muted:#7C8896;
    --safe:#20D6A8;
    --warn:#FFB020;
    --danger:#FF5252;
    --accent:#3FD0FF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(63,208,255,0.07), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(32,214,168,0.06), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:20px 16px 60px;
  }
  .wrap{max-width:520px;margin:0 auto;}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .logo{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.02em;
  }
  .logo span{color:var(--accent);}
  .logo small{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-weight:400;
    font-size:10px;
    color:var(--muted);
    letter-spacing:0.12em;
    margin-top:1px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--safe);box-shadow:0 0 8px var(--safe);}

  .scan-card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px 18px;
    margin-bottom:18px;
  }
  .scan-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:10px;
  }
  .code-row{display:flex;gap:8px;}
  #barcodeInput{
    flex:1;
    background:#080B0E;
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    font-size:20px;
    letter-spacing:0.06em;
    padding:14px 14px;
    outline:none;
    min-width:0;
  }
  #barcodeInput:focus{border-color:var(--accent);}
  #barcodeInput::placeholder{color:#3E4750;letter-spacing:0.04em;}
  .btn{
    border:none;
    border-radius:12px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    padding:0 18px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--accent);color:#04141C;}
  .btn-cam{
    background:var(--danger);
    border:1px solid var(--danger);
    color:#fff;
    width:56px;
    flex-shrink:0;
    box-shadow:0 0 0 4px rgba(255,82,82,0.15);
  }
  .btn-cam svg{width:24px;height:24px;}
  .btn-cam.active{
    background:#3E0F0F;
    border-color:var(--danger);
    color:var(--danger);
    box-shadow:0 0 0 4px rgba(255,82,82,0.25);
  }
  .actions{display:flex;gap:8px;margin-top:10px;}
  .actions .btn-primary{flex:1;padding:13px;}
  #camWrap{display:none;margin-top:12px;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line);}
  #camVideo{width:100%;display:block;background:#000;}
  #camWrap.active{display:block;}
  .cam-reticle{position:absolute;inset:20% 12%;border:2px solid var(--accent);border-radius:10px;pointer-events:none;box-shadow:0 0 0 2000px rgba(0,0,0,0.35);}

  #status{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    margin-top:10px;
    min-height:16px;
  }

  #result{display:none;}
  .stamp-wrap{display:flex;justify-content:center;margin:6px 0 18px;}
  .stamp{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    padding:9px 18px;
    border-radius:999px;
    border:1.5px solid currentColor;
    transform:rotate(-2deg) scale(0.6);
    opacity:0;
    animation:stampIn .38s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampIn{to{transform:rotate(-2deg) scale(1);opacity:1;}}
  .stamp.safe{color:var(--safe);}
  .stamp.warn{color:var(--warn);}
  .stamp.danger{color:var(--danger);}

  .product-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
  }
  .product-head{display:flex;gap:12px;align-items:center;}
  .product-img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#080B0E;border:1px solid var(--line);flex-shrink:0;}
  .product-img.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;}
  .product-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;line-height:1.25;}
  .product-code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px;}

  .section-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin:18px 0 8px;
  }

  .flag{
    display:flex;
    gap:10px;
    align-items:flex-start;
    background:var(--panel2);
    border-left:3px solid var(--danger);
    border-radius:0 10px 10px 0;
    padding:11px 12px;
    margin-bottom:8px;
  }
  .flag.medium{border-left-color:var(--warn);}
  .flag-ico{font-size:16px;line-height:1.3;flex-shrink:0;}
  .flag-body b{font-family:'Space Grotesk',sans-serif;font-size:14px;}
  .flag-body p{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4;}

  .clean-msg{
    display:flex;gap:10px;align-items:center;
    background:var(--panel2);
    border-left:3px solid var(--safe);
    border-radius:0 10px 10px 0;
    padding:11px 12px;
    font-size:13px;
    color:var(--text);
  }

  .ingredients-text{
    font-size:13px;
    line-height:1.55;
    color:#B7C0C9;
    background:var(--panel2);
    border-radius:10px;
    padding:12px 13px;
  }
  .ingredients-text mark{
    background:transparent;
    color:var(--danger);
    font-weight:600;
  }
  .ingredients-text mark.medium{color:var(--warn);}

  .meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:5px 10px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--muted);
  }

  footer{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#3E4750;
    margin-top:24px;
    letter-spacing:0.04em;
  }

  @media (prefers-reduced-motion: reduce){
    .stamp{animation:none;opacity:1;transform:rotate(-2deg) scale(1);}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">СОСТАВ<span>.</span>SCAN<small>ПРОВЕРКА ДОБАВОК ПО ШТРИХКОДУ</small></div>
    <div class="dot" id="liveDot"></div>
  </header>

  <div class="scan-card">
    <div class="scan-label">Штрихкод товара</div>
    <div class="code-row">
      <input id="barcodeInput" inputmode="numeric" placeholder="4607... / 4600..." maxlength="14">
      <button class="btn btn-cam" id="camBtn" title="Сканировать камерой">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8a2 2 0 0 1 2-2h1.2a1 1 0 0 0 .83-.45l.94-1.4A1 1 0 0 1 9.8 3.5h4.4a1 1 0 0 1 .83.45l.94 1.4a1 1 0 0 0 .83.45H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/>
          <circle cx="12" cy="13" r="3.5"/>
        </svg>
      </button>
    </div>
    <div id="camWrap"><video id="camVideo" playsinline muted></video><div class="cam-reticle"></div></div>
    <div class="actions">
      <button class="btn btn-primary" id="checkBtn">Проверить состав</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="result">
    <div class="stamp-wrap"><div class="stamp" id="stamp"></div></div>

    <div class="product-card">
      <div class="product-head">
        <img class="product-img" id="prodImg" alt="">
        <div>
          <div class="product-name" id="prodName">—</div>
          <div class="product-code" id="prodCode">—</div>
        </div>
      </div>

      <div class="section-title">Обнаруженные добавки</div>
      <div id="flagsList"></div>

      <div id="ingredientsBlock" style="display:none;">
        <div class="section-title">Состав</div>
        <div class="ingredients-text" id="ingredientsText"></div>
      </div>

      <div class="meta-row" id="metaRow"></div>
    </div>
  </div>

  <footer>ДАННЫЕ: OPEN FOOD FACTS · СПРАВОЧНО, НЕ МЕДИЦИНСКАЯ РЕКОМЕНДАЦИЯ</footer>
</div>

<script>
// --- база спорных/вредных добавок ---
const RISK_DB = {
  'e102':{name:'Тартразин', risk:'medium', note:'синтетический краситель, связывают с гиперактивностью у детей'},
  'e104':{name:'Хинолиновый жёлтый', risk:'medium', note:'краситель, возможные аллергические реакции'},
  'e110':{name:'Жёлтый «солнечный закат»', risk:'medium', note:'краситель, запрещён в ряде стран для детского питания'},
  'e122':{name:'Азорубин', risk:'medium', note:'краситель из группы азокрасителей'},
  'e124':{name:'Понсо 4R', risk:'high', note:'краситель, ограничен в некоторых странах, связывают с гиперактивностью'},
  'e129':{name:'Красный очаровательный AC', risk:'high', note:'синтетический краситель, запрещён в части стран ЕС'},
  'e211':{name:'Бензоат натрия', risk:'medium', note:'консервант; с витамином C может образовывать следовые количества бензола'},
  'e220':{name:'Диоксид серы', risk:'medium', note:'консервант-сульфит, риск при астме и аллергии'},
  'e221':{name:'Сульфит натрия', risk:'medium', note:'консервант-сульфит, риск при астме и аллергии'},
  'e223':{name:'Пиросульфит натрия', risk:'medium', note:'консервант-сульфит, риск при астме и аллергии'},
  'e249':{name:'Нитрит калия', risk:'high', note:'консервант, при нагреве может образовывать нитрозамины'},
  'e250':{name:'Нитрит натрия', risk:'high', note:'консервант в колбасных изделиях, потенциально канцерогенные соединения при переработке'},
  'e251':{name:'Нитрат натрия', risk:'high', note:'консервант, тот же риск, что и у нитритов'},
  'e252':{name:'Нитрат калия', risk:'high', note:'консервант, тот же риск, что и у нитритов'},
  'e320':{name:'БГА (BHA)', risk:'medium', note:'антиоксидант, есть данные о потенциальной канцерогенности'},
  'e321':{name:'БГТ (BHT)', risk:'medium', note:'антиоксидант, спорная безопасность при накоплении'},
  'e407':{name:'Каррагинан', risk:'medium', note:'загуститель, в исследованиях связывают с раздражением ЖКТ'},
  'e621':{name:'Глутамат натрия', risk:'low', note:'усилитель вкуса, у части людей вызывает индивидуальную чувствительность'},
  'e950':{name:'Ацесульфам К', risk:'low', note:'подсластитель, безопасность в целом подтверждена, но есть споры'},
  'e951':{name:'Аспартам', risk:'medium', note:'подсластитель, ВОЗ отнесла к «возможно канцерогенным» (группа 2B)'},
  'e952':{name:'Цикламат', risk:'medium', note:'подсластитель, запрещён в США'},
  'e954':{name:'Сахарин', risk:'low', note:'подсластитель, исторически спорная репутация'},
};
const PALM_KEYWORDS = ['пальм','palm oil','palm-oil'];

function classify(product){
  const flags = [];
  const additiveTags = product.additives_tags || [];
  additiveTags.forEach(tag=>{
    const code = tag.split(':').pop().toLowerCase();
    if(RISK_DB[code]) flags.push({code:code.toUpperCase(), ...RISK_DB[code]});
  });

  const ingredientsText = (product.ingredients_text_ru || product.ingredients_text || '').toLowerCase();
  const analysisTags = (product.ingredients_analysis_tags || []).join(' ');
  const hasPalm = PALM_KEYWORDS.some(k=>ingredientsText.includes(k)) || analysisTags.includes('palm-oil') && !analysisTags.includes('palm-oil-free');
  if(hasPalm){
    flags.unshift({code:'ПАЛЬМ', name:'Пальмовое масло', risk:'medium',
      note:'дешёвый заменитель жира; при промышленном рафинировании образует канцерогенные глицидиловые эфиры'});
  }

  const nova = product.nova_group;
  return {flags, nova, ingredientsText};
}

function riskLevel(flags){
  if(flags.some(f=>f.risk==='high')) return 'danger';
  if(flags.length) return 'warn';
  return 'safe';
}

function highlightIngredients(text, flags){
  if(!text) return '';
  let escaped = text.replace(/</g,'&lt;');
  flags.forEach(f=>{
    const terms = [f.name.toLowerCase()];
    if(f.code!=='ПАЛЬМ') terms.push(f.code.toLowerCase());
    terms.forEach(term=>{
      if(!term) return;
      const re = new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
      escaped = escaped.replace(re, m=>`<mark class="${f.risk==='high'?'':'medium'}">${m}</mark>`);
    });
  });
  return escaped;
}

const $ = id=>document.getElementById(id);

async function lookup(code){
  $('status').textContent = 'Запрашиваю базу…';
  $('result').style.display='none';
  try{
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_ru,ingredients_text,ingredients_text_ru,additives_tags,ingredients_analysis_tags,nova_group,image_front_url,nutriscore_grade`);
    const data = await res.json();
    if(data.status !== 1 || !data.product){
      $('status').textContent = 'Товар не найден в базе Open Food Facts.';
      return;
    }
    const product = data.product;
    const {flags, nova, ingredientsText} = classify(product);
    const level = riskLevel(flags);

    $('stamp').className = 'stamp '+level;
    $('stamp').textContent = level==='safe' ? 'Спорных добавок не найдено' : level==='warn' ? 'Есть спорные добавки' : 'Обнаружены вредные добавки';

    $('prodImg').src = product.image_front_url || '';
    $('prodImg').classList.toggle('empty', !product.image_front_url);
    $('prodName').textContent = product.product_name_ru || product.product_name || 'Без названия';
    $('prodCode').textContent = code;

    const flagsList = $('flagsList');
    flagsList.innerHTML = '';
    if(flags.length===0){
      flagsList.innerHTML = `<div class="clean-msg">✓ Известных вредных добавок и пальмового масла в составе не обнаружено</div>`;
    } else {
      flags.forEach(f=>{
        const div = document.createElement('div');
        div.className = 'flag '+(f.risk==='high'?'':'medium');
        div.innerHTML = `<div class="flag-ico">${f.risk==='high'?'⚠️':'●'}</div><div class="flag-body"><b>${f.code!=='ПАЛЬМ'?f.code+' — ':''}${f.name}</b><p>${f.note}</p></div>`;
        flagsList.appendChild(div);
      });
    }

    if(ingredientsText){
      $('ingredientsBlock').style.display='block';
      $('ingredientsText').innerHTML = highlightIngredients(product.ingredients_text_ru || product.ingredients_text, flags);
    } else {
      $('ingredientsBlock').style.display='none';
    }

    const meta = $('metaRow');
    meta.innerHTML = '';
    if(nova) meta.innerHTML += `<div class="chip">NOVA ${nova}${nova>=4?' · ультра-обработанный':''}</div>`;
    if(product.nutriscore_grade) meta.innerHTML += `<div class="chip">Nutri-Score ${product.nutriscore_grade.toUpperCase()}</div>`;

    $('status').textContent = '';
    $('result').style.display='block';
  }catch(e){
    $('status').textContent = 'Ошибка запроса. Проверь соединение и код товара.';
  }
}

$('checkBtn').addEventListener('click', ()=>{
  const code = $('barcodeInput').value.trim().replace(/\D/g,'');
  if(code.length < 6){ $('status').textContent='Введи корректный штрихкод.'; return; }
  lookup(code);
});
$('barcodeInput').addEventListener('keydown', e=>{ if(e.key==='Enter') $('checkBtn').click(); });

// --- камера: ZXing (работает в любом Chromium-браузере, включая Яндекс) с fallback на нативный BarcodeDetector ---
let stream = null;
let zxingReader = null;
let scanning = false;

function stopCam(){
  const wrap = $('camWrap');
  wrap.classList.remove('active');
  $('camBtn').classList.remove('active');
  scanning = false;
  if(zxingReader){ try{ zxingReader.reset(); }catch(e){} }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
}

function explainCamError(e){
  const insecure = location.protocol !== 'https:' && location.hostname !== 'localhost';
  if(insecure){
    return 'Камера недоступна: страница открыта не по HTTPS (например, напрямую с диска). Открой файл через хостинг по https или через встроенный просмотр Claude — тогда доступ к камере сработает.';
  }
  if(e && (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError')){
    return 'Доступ к камере запрещён. Разреши камеру для этой страницы в настройках браузера (значок замка/камеры в адресной строке) и попробуй снова.';
  }
  if(e && e.name === 'NotFoundError'){
    return 'Камера не найдена на устройстве.';
  }
  if(e && e.name === 'NotReadableError'){
    return 'Камера занята другим приложением.';
  }
  return 'Нет доступа к камере. Введи штрихкод вручную.';
}

async function startCamZXing(){
  const wrap = $('camWrap');
  const video = $('camVideo');
  wrap.classList.add('active');
  $('camBtn').classList.add('active');
  $('status').textContent = '';
  const hints = new Map();
  const formats = [
    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
    ZXing.BarcodeFormat.CODE_128
  ];
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
  zxingReader = new ZXing.BrowserMultiFormatReader(hints);
  scanning = true;
  try{
    await zxingReader.decodeFromConstraints(
      {video:{facingMode:'environment'}},
      video,
      (result, err)=>{
        if(!scanning) return;
        if(result){
          $('barcodeInput').value = result.getText();
          stopCam();
          $('checkBtn').click();
        }
      }
    );
  }catch(e){
    $('status').textContent = explainCamError(e);
    stopCam();
  }
}

async function startCamNative(){
  const wrap = $('camWrap');
  $('status').textContent = '';
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video = $('camVideo');
    video.srcObject = stream;
    await video.play();
    wrap.classList.add('active');
    $('camBtn').classList.add('active');
    const detector = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
    scanning = true;
    const loop = async ()=>{
      if(!scanning) return;
      try{
        const codes = await detector.detect(video);
        if(codes.length){
          $('barcodeInput').value = codes[0].rawValue;
          stopCam();
          $('checkBtn').click();
          return;
        }
      }catch(e){}
      requestAnimationFrame(loop);
    };
    loop();
  }catch(e){
    $('status').textContent = explainCamError(e);
    stopCam();
  }
}

$('camBtn').addEventListener('click', ()=>{
  const wrap = $('camWrap');
  if(wrap.classList.contains('active')){ stopCam(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    $('status').textContent = explainCamError(null);
    return;
  }
  if(window.ZXing){ startCamZXing(); }
  else if('BarcodeDetector' in window){ startCamNative(); }
  else { $('status').textContent = 'Камера-сканер недоступен в этом браузере, введи код вручную.'; }
});
</script>
</body>
</html>
